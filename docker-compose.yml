services:
  postgres:
    image: postgres:16-alpine
    container_name: pqrs_postgres
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?Define DB_USER en .env} -d ${DB_NAME:?Define DB_NAME en .env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - interna
    restart: unless-stopped

  backend:
    build:
      context: ./pqrs-backend
    container_name: pqrs_backend
    mem_limit: 512m
    environment:
      
      NODE_ENV: ${NODE_ENV:?Define NODE_ENV en .env}
      PORT: 3000
      DB_HOST: ${DB_HOST:?Define DB_HOST en .env}
      DB_PORT: ${DB_PORT:?Define DB_PORT en .env}
      
      DB_USER: ${DB_USER:?Define DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DB_NAME: ${DB_NAME:?Define DB_NAME en .env}
      
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}

      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Define JWT_REFRESH_SECRET en .env}
      FRONTEND_URL: ${FRONTEND_URL:?Define FRONTEND_URL en .env}

      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

    expose:
      - "3000"
    volumes:
      - ./pqrs-backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - publica
      - interna
    restart: unless-stopped

  frontend:
    build:
      context: ./pqrs-frontend
    container_name: pqrs_frontend
    mem_limit: 256m
    expose:
      - "4000"
    depends_on:
      - backend
    networks:
      - publica
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: pqrs_nginx
    mem_limit: 64m
    ports:
      - "${NGINX_PORT:?Define NGINX_PORT en .env}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - publica
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  publica:
    driver: bridge
  interna:
    driver: bridge
    internal: true
